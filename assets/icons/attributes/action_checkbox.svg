<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Thick green checkbox with black outline per user request.
       "Action" axis icon in the recipe optimizer. The fancy SVG checkmark
       we had before (checkmark.svg) felt out of place next to the other
       plain axis icons; this mimics a simple checkbox instead. -->
  <rect x="3" y="3" width="18" height="18" rx="3" ry="3"
        fill="#22c55e" stroke="#000" stroke-width="2.5"/>
  <path d="M6.5 12 L10 15.5 L17 8"
        fill="none" stroke="#000" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
